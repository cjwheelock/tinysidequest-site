<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="no-referrer">
  <meta name="theme-color" content="#faf8f3">
  <title>SideQuest</title>
  <link rel="icon" href="./favicon.ico">
  <link rel="stylesheet" href="./shell.css">
  <script src="./config.js" defer></script>
  <script src="./vendor/supabase.js" defer></script>
  <script type="module" src="./src/app.js?v=20261102-fragments"></script>
</head>
<body>
  <div id="viewer-toolbar" hidden><span>SideQuest</span><button id="change-code" type="button">Change code</button></div>
  <main id="viewer" aria-label="SideQuest preview"></main>
  <section id="entry" aria-labelledby="entry-title">
    <div class="entry-card">
      <a class="brand" href="https://tinysidequest.com/" aria-label="SideQuest home"><img src="./wordmark.png" width="182" height="68" alt="SideQuest"></a>
      <h1 id="entry-title">Enter your code</h1>
      <form id="code-form" aria-busy="false">
        <label for="code">Code</label>
        <input id="code" name="code" type="text" inputmode="text" autocomplete="off" autocapitalize="characters" spellcheck="false" minlength="6" maxlength="8" required aria-describedby="error status">
        <p id="error" role="alert"></p>
        <button id="continue" type="submit">Continue</button>
        <p id="status" role="status" aria-live="polite"></p>
      </form>
    </div>
  </section>
</body>
</html>
